name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-x86_64,  os: macos-13,      target: x86_64-apple-darwin }
          - { name: macos-arm64,   os: macos-14,      target: aarch64-apple-darwin }
          - { name: linux-x86_64,  os: ubuntu-24.04,  target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64,   os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            package-lock.json

      - name: 安装 Linux 依赖
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libayatana-appindicator3-dev patchelf file libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: |
          npm ci --no-audit --no-fund
          npm --prefix ui ci --no-audit --no-fund

      - name: 构建
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: 收集产物
        run: |
          mkdir -p dist
          find src-tauri/target/${{ matrix.target }}/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} dist/ \; 2>/dev/null || true
          ls -lh dist || true

      - uses: actions/upload-artifact@v4
        with:
          name: OnKey-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
